<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Log | Kolosseum Tools</title>
  <meta name="description" content="Record local session entries and copy the latest entry.">
  <meta name="theme-color" content="#050607">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body class="session-log-page">
  <main class="tool-main">
    <header class="topbar">
      <a class="brand" href="../../"><span class="brand-word">KOLOSSEUM</span><span class="brand-line"></span><span class="brand-sub">TOOLS</span></a>
      <nav class="nav"><a href="../../">Home</a><a href="../">Tools</a></nav>
      <a class="nav-cta" href="../">Tool Index</a>
    </header>

    <section class="tool-page-hero">
      <p class="kicker">SESSION RECORD</p>
      <h1>Session Log</h1>
      <p class="lede">Record local session entries and copy the latest entry.</p>
    </section>

    <section class="panel active-tool-panel" aria-label="Session Log active tool">
      <div class="panel-head">
        <div><p class="kicker">ACTIVE TOOL</p><h2>Session Log</h2></div>
        <span class="status-pill">Live</span>
      </div>
      <div class="tool-workspace">
        <form class="tool-form" id="session-log-form">
          <label for="sessionTitle">Session title</label>
          <input id="sessionTitle" type="text" placeholder="Lower body session">
          <label for="sessionNotes">Session notes</label>
          <textarea id="sessionNotes" placeholder="Main work, notes, and observations"></textarea>
          <button class="button button-primary" type="button">Save Entry</button>
        </form>
        <article class="tool-output">
          <p class="kicker">LOCAL ONLY</p>
          <h2>Latest entry</h2>
          <pre>Session entries will appear here.</pre>
          <div class="actions"><button class="button button-secondary" type="button">Copy Latest</button></div>
        </article>
      </div>
    </section>

      <section class="related-tools" aria-label="Other Kolosseum tools">
        <div class="related-head"><p class="kicker">OTHER TOOLS</p><a href="../">View all</a></div>
        <div class="related-rail">
          <a class="related-chip" href="../event-block-calculator/">
            <span class="tool-icon"><img src="../../assets/icons/kolosseum-tools-icon-event-block-calculator.png" alt="" loading="lazy"></span>
            <strong>Event Block</strong>
          </a>
          <a class="related-chip" href="../ironclock/">
            <span class="tool-icon"><img src="../../assets/icons/kolosseum-tools-icon-ironclock.png" alt="" loading="lazy"></span>
            <strong>IronClock</strong>
          </a>
          <a class="related-chip" href="../gym-share/">
            <span class="tool-icon"><img src="../../assets/icons/kolosseum-tools-icon-gym-share.png" alt="" loading="lazy"></span>
            <strong>Gym Share</strong>
          </a>
          <a class="related-chip" href="../meet-planner/">
            <span class="tool-icon"><img src="../../assets/icons/kolosseum-tools-icon-meet-planner.png" alt="" loading="lazy"></span>
            <strong>Meet Planner</strong>
          </a>
          <a class="related-chip" href="../load-sheet/">
            <span class="tool-icon"><img src="../../assets/icons/kolosseum-tools-icon-load-sheet.png" alt="" loading="lazy"></span>
            <strong>Load Sheet</strong>
          </a>
        </div>
      </section>
  </main>
  <script src="../../assets/js/shared.js" defer></script>
</body>
</html>
